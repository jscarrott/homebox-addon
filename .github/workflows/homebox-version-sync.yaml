name: Sync Homebox releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync:
    name: Update Homebox version references
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.4

      - name: Get latest Homebox release
        id: latest
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.request('GET /repos/sysadminsmedia/homebox/releases/latest');
            let tag = data.tag_name || '';
            if (tag.startsWith('v')) {
              tag = tag.slice(1);
            }
            if (!tag) {
              core.setFailed('Could not determine Homebox release tag');
            }
            core.setOutput('version', tag);

      # The add-on has its own version series (2.x) that is independent of the packaged
      # Homebox version. The Homebox version we currently ship is the tag on the base
      # image in build.yaml -- never config.yaml's `version:`.
      - name: Read current versions
        id: current
        run: |
          homebox=$(grep -oE 'ghcr\.io/sysadminsmedia/homebox:[^"[:space:]]+' example/build.yaml \
            | head -n1 | cut -d: -f2)
          addon=$(grep '^version:' example/config.yaml | head -n1 \
            | sed -E 's/^version:[[:space:]]*"?([^"[:space:]]*)"?.*/\1/')

          if [ -z "$homebox" ]; then
            echo "::error::Could not find a ghcr.io/sysadminsmedia/homebox image in example/build.yaml"
            exit 1
          fi
          if [ -z "$addon" ]; then
            echo "::error::Could not read version: from example/config.yaml"
            exit 1
          fi

          echo "Packaged Homebox: $homebox | add-on version: $addon"
          echo "homebox=$homebox" >> $GITHUB_OUTPUT
          echo "addon=$addon" >> $GITHUB_OUTPUT

      - name: Stop if already on latest Homebox
        if: steps.latest.outputs.version == steps.current.outputs.homebox
        run: |
          echo "Homebox ${{ steps.latest.outputs.version }} is already packaged." >> $GITHUB_STEP_SUMMARY

      - name: Update add-on metadata to Homebox ${{ steps.latest.outputs.version }}
        id: update
        if: steps.latest.outputs.version != steps.current.outputs.homebox
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = "${{ steps.latest.outputs.version }}"
          previous = "${{ steps.current.outputs.homebox }}"
          current_addon = "${{ steps.current.outputs.addon }}"

          # Packaging a new Homebox release is a feature bump of the add-on's own version.
          # Writing `version` here instead would be a downgrade (2.1.0 -> 0.26.2) and
          # Supervisor would never offer the update.
          major, minor = (current_addon.split(".") + ["0", "0"])[:2]
          addon_version = f"{int(major)}.{int(minor) + 1}.0"

          config_path = Path("example/config.yaml")
          config_lines = config_path.read_text().splitlines()
          config_path.write_text("\n".join(
              [f'version: "{addon_version}"' if line.startswith("version:") else line for line in config_lines]
          ) + "\n")

          # Upstream publishes one multi-arch manifest per release (linux/amd64 +
          # linux/arm64), so every arch points at the same plain tag. The old
          # `<version>-arm` suffix no longer resolves.
          build_path = Path("example/build.yaml")
          updated_build, count = re.subn(
              r'(ghcr\.io/sysadminsmedia/homebox):[^"\s]+',
              rf'\g<1>:{version}',
              build_path.read_text(),
          )
          if not count:
              raise SystemExit("No ghcr.io/sysadminsmedia/homebox image found in example/build.yaml")
          build_path.write_text(updated_build)

          changelog_path = Path("example/CHANGELOG.md")
          lines = changelog_path.read_text().splitlines()
          header = lines[0]
          rest = "\n".join(lines[1:]).lstrip()
          entries = (
              f"## {addon_version}\n\n"
              f"- Updated Homebox to **v{version}** (from {previous}).\n\n"
          )
          changelog_path.write_text(f"{header}\n\n{entries}{rest}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"addon_version={addon_version}\n")
          PY

      # Requires "Allow GitHub Actions to create and approve pull requests"
      # (Settings -> Actions -> General). Without it this step fails with
      # "GitHub Actions is not permitted to create or approve pull requests".
      - name: Create pull request
        if: steps.latest.outputs.version != steps.current.outputs.homebox
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/homebox-${{ steps.latest.outputs.version }}
          commit-message: "chore: track Homebox ${{ steps.latest.outputs.version }}"
          title: "Update add-on to ${{ steps.update.outputs.addon_version }} (Homebox ${{ steps.latest.outputs.version }})"
          body: |
            ## Summary
            - package Homebox ${{ steps.latest.outputs.version }} (was ${{ steps.current.outputs.homebox }})
            - bump the add-on version to ${{ steps.update.outputs.addon_version }} so Supervisor offers the update
            - open a PR so the builder can publish refreshed add-on images after merge

            ## Testing
            - not run (automation workflow)
